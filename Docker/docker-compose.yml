version: '3.8'

services:
  # =============================================================================
  # Database Service: MongoDB
  # =============================================================================
  mongodb:
    image: mongo:7.0
    container_name: threat_intel_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - threat_intel_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Backend Service: Node.js Express REST API
  # =============================================================================
  backend:
    container_name: threat_intel_backend
    restart: unless-stopped
    build:
      context: ../Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/cyber_threat_intel
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-supersecretthreatinteljwtkey2026!devopsplatform}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@portal.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePass2026!}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - threat_intel_network

  # =============================================================================
  # Frontend Service: React Application (Nginx SPA)
  # =============================================================================
  frontend:
    container_name: threat_intel_frontend
    restart: unless-stopped
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - threat_intel_network

# =============================================================================
# Persistent Volumes Configuration
# =============================================================================
volumes:
  mongodb_data:
    name: threat_intel_mongodb_data

# =============================================================================
# Isolated Docker Bridge Network
# =============================================================================
networks:
  threat_intel_network:
    driver: bridge
    name: threat_intel_network
